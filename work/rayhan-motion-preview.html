<style>
  #rayhan-motion-preview .motion-tabs { flex-wrap: wrap; margin-bottom: 12px; }
  #rayhan-motion-preview .sample-stage { padding: clamp(8px, 2vw, 16px); }
  #rayhan-motion-preview .sample-site {
    color-scheme: dark;
    --site-bg: #111316;
    --site-ink: #f6f4ef;
    --site-subtle: #cec9c2;
    --site-accent: #edc99f;
    --site-serif: Baskerville, "Iowan Old Style", Georgia, serif;
    --site-sans: "Avenir Next", Avenir, "Segoe UI", system-ui, sans-serif;
    min-height: 250px;
    color: var(--site-ink);
    background: var(--site-bg);
    font-family: var(--site-sans);
  }
  #rayhan-motion-preview .sample-site :focus-visible { outline: 2px solid var(--site-accent); outline-offset: 3px; }
  #rayhan-motion-preview .sample-site h2,
  #rayhan-motion-preview .sample-site h3 { margin: 0; font: 400 1.65rem/1.12 var(--site-serif); }
  #rayhan-motion-preview .sample-actions { margin-top: 8px; }
  #rayhan-motion-preview .hero-sample { position: relative; isolation: isolate; overflow: clip; display: grid; align-items: center; }
  #rayhan-motion-preview .hero-portrait,
  #rayhan-motion-preview .hero-sample::after { position: absolute; inset: 0; }
  #rayhan-motion-preview .hero-portrait {
    width: 78%; height: 100%; left: auto; z-index: -2;
    object-fit: cover; object-position: center 22%; filter: brightness(.78);
    mask-image: linear-gradient(90deg, transparent, #000 30%);
  }
  #rayhan-motion-preview .hero-sample::after {
    z-index: -1; content: "";
    background: linear-gradient(90deg, #101114 2%, #101114e3 22%, #10111425 67%, transparent), linear-gradient(0deg, #0b0c0d87, transparent 65%);
  }
  #rayhan-motion-preview .hero-type { padding: clamp(14px, 5vw, 36px); }
  #rayhan-motion-preview .hero-type p {
    margin: 0 0 10px; color: var(--site-subtle);
    font: 650 .72rem/1.5 var(--site-sans); letter-spacing: .1em; text-transform: uppercase;
  }
  #rayhan-motion-preview .hero-type h2 { font: 400 clamp(3rem, 9vw, 5rem)/.88 var(--site-serif); letter-spacing: -.065em; }
  #rayhan-motion-preview .hero-cta {
    display: inline-block; margin-top: 16px; padding: .55rem .75rem;
    color: #24211e; background: var(--site-accent); font-size: .85rem; font-weight: 650;
  }
  #rayhan-motion-preview .gallery-sample { padding: clamp(12px, 4vw, 22px); }
  #rayhan-motion-preview .sample-stills { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; margin-top: 12px; }
  #rayhan-motion-preview .sample-still,
  #rayhan-motion-preview .sample-headshot,
  #rayhan-motion-preview .viewer-control { border: 0; padding: 0; background: transparent; color: inherit; font: inherit; }
  #rayhan-motion-preview .sample-still { text-align: left; }
  #rayhan-motion-preview .sample-still img { display: block; width: 100%; height: auto; aspect-ratio: 16 / 10; object-fit: cover; }
  #rayhan-motion-preview .sample-still span { display: block; margin-top: 5px; color: var(--site-subtle); font-size: .85rem; }
  #rayhan-motion-preview .sample-still:hover img { outline: 1px solid var(--site-accent); }
  #rayhan-motion-preview .sample-viewer {
    color: var(--site-ink); background: var(--site-bg); border: 0;
    width: min(calc(100% - 24px), 34rem); max-height: calc(100% - 24px); padding: 8px 12px;
  }
  #rayhan-motion-preview .sample-viewer::backdrop { background: #08090ce8; }
  #rayhan-motion-preview .sample-viewer-header,
  #rayhan-motion-preview .sample-viewer-controls { display: flex; align-items: center; gap: 8px; }
  #rayhan-motion-preview .sample-viewer-header { justify-content: space-between; }
  #rayhan-motion-preview .sample-viewer-header h3 { font-size: 1.35rem; }
  #rayhan-motion-preview .sample-viewer-controls { justify-content: center; font-size: .8rem; }
  #rayhan-motion-preview .viewer-photo { display: block; width: 100%; height: min(38dvh, 17rem); object-fit: contain; }
  #rayhan-motion-preview .viewer-control { min-width: 44px; min-height: 44px; font-size: 1.4rem; }
  #rayhan-motion-preview .viewer-control:hover { color: var(--site-accent); }
  #rayhan-motion-preview .casting-sample { display: grid; gap: 12px; grid-template-columns: 1fr min(42%, 15rem); align-items: center; padding: clamp(12px, 5vw, 26px); }
  #rayhan-motion-preview .casting-sample-copy p { margin: 6px 0 0; color: var(--site-subtle); font-size: .8rem; }
  #rayhan-motion-preview .sample-headshot { display: block; position: relative; }
  #rayhan-motion-preview .sample-headshot img { display: block; width: 100%; height: auto; aspect-ratio: 4 / 5; object-fit: cover; object-position: center 30%; }
  #rayhan-motion-preview .sample-open {
    position: absolute; inset: 8px 8px auto auto; width: 36px; height: 36px;
    border-radius: 50%; display: grid; place-items: center;
    color: var(--site-bg); background: var(--site-ink); font-size: 1.15rem;
  }
  #rayhan-motion-preview .sample-headshot:is(:hover, :focus-visible) .sample-open,
  #rayhan-motion-preview .sample-headshot[data-replaying] .sample-open { background: var(--site-accent); }

  @media (prefers-reduced-motion: no-preference) {
    #rayhan-motion-preview .hero-sample[data-replaying] .hero-type h2 { animation: rmp-rise 480ms cubic-bezier(.2, .65, .3, 1) both; }
    #rayhan-motion-preview .hero-sample[data-replaying] .hero-cta { animation: rmp-rise 320ms 85ms cubic-bezier(.2, .65, .3, 1) both; }
    #rayhan-motion-preview .sample-viewer[open] { animation: rmp-fade 180ms ease-out; }
    #rayhan-motion-preview .sample-viewer[open]::backdrop { animation: rmp-fade 180ms ease-out; }
    #rayhan-motion-preview .viewer-photo[data-replaying] { animation: rmp-fade 160ms ease-out; }
    #rayhan-motion-preview .sample-open { transition: transform 160ms ease-out, background-color 160ms ease-out; }
    #rayhan-motion-preview .sample-headshot:is(:hover, :focus-visible) .sample-open,
    #rayhan-motion-preview .sample-headshot[data-replaying] .sample-open { transform: translate(3px, -3px); }
  }
  @keyframes rmp-rise { from { opacity: .25; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
  @keyframes rmp-fade { from { opacity: 0; } to { opacity: 1; } }
</style>

<script>
  (() => {
    const root = document.getElementById('rayhan-motion-preview');
    const hero = root.querySelector('.hero-sample');
    const headshot = root.querySelector('.sample-headshot');
    const viewer = root.querySelector('.sample-viewer');
    const photo = viewer.querySelector('.viewer-photo');
    const title = viewer.querySelector('h3');
    const position = viewer.querySelector('output');
    const stills = Array.from(root.querySelectorAll('[data-still]'));
    const altText = [
      'Rayhan performing in a North Shore Mathletes costume during a musical number',
      'Rayhan in a blue checked shirt against a brick wall in a close-up from Little Death'
    ];
    let selected = 0;
    let iconTimer;

    headshot.querySelector('img').src = hero.querySelector('img').src;

    function replay(element) {
      element.removeAttribute('data-replaying');
      void element.offsetWidth;
      element.setAttribute('data-replaying', '');
    }

    function replayIcon() {
      replay(headshot);
      clearTimeout(iconTimer);
      iconTimer = setTimeout(() => headshot.removeAttribute('data-replaying'), 450);
    }

    function showPhoto(index) {
      selected = (index + stills.length) % stills.length;
      const still = stills[selected];
      photo.src = still.querySelector('img').src;
      photo.alt = altText[selected];
      title.textContent = still.querySelector('span').textContent;
      position.value = `${selected + 1} / ${stills.length}`;
      if (viewer.open) replay(photo);
    }

    root.querySelector('[data-replay]').addEventListener('click', () => replay(hero));
    root.querySelector('[data-casting-replay]').addEventListener('click', replayIcon);
    headshot.addEventListener('click', replayIcon);
    stills.forEach((still, index) => still.addEventListener('click', () => {
      photo.removeAttribute('data-replaying');
      showPhoto(index);
      viewer.showModal();
    }));
    viewer.querySelector('[data-close]').addEventListener('click', () => viewer.close());
    viewer.querySelector('[data-previous]').addEventListener('click', () => showPhoto(selected - 1));
    viewer.querySelector('[data-next]').addEventListener('click', () => showPhoto(selected + 1));
    viewer.addEventListener('keydown', (event) => {
      if (event.key !== 'ArrowLeft' && event.key !== 'ArrowRight') return;
      event.preventDefault();
      showPhoto(selected + (event.key === 'ArrowLeft' ? -1 : 1));
    });
  })();
</script>

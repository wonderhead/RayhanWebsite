<style>
  #rayhan-media-options {
    max-inline-size: 68rem;
    margin-inline: auto;
    --rm-dark: #111316;
    --rm-panel: #25272b;
    --rm-ink: #f6f4ef;
    --rm-muted: #cec9c2;
    --rm-gold: #edc99f;
    --rm-line: #4a4b4e;
    --rm-sans: "Avenir Next", Avenir, "Segoe UI", system-ui, sans-serif;
    --rm-serif: Baskerville, "Iowan Old Style", Georgia, serif;
  }
  #rayhan-media-options [hidden] { display: none !important; }
  #rayhan-media-options .rm-page, #rayhan-media-options dialog {
    color: var(--rm-ink);
    font: 400 1rem/1.45 var(--rm-sans);
    background: var(--rm-dark);
  }
  #rayhan-media-options .rm-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 1rem;
    padding: .8rem clamp(.9rem, 4.3vw, 2.5rem);
    border-block-end: 1px solid var(--rm-line);
  }
  #rayhan-media-options .rm-header span:first-child { font: 400 1.55rem/1.1 var(--rm-serif); }
  #rayhan-media-options [aria-current] { color: var(--rm-muted); text-decoration: underline; text-underline-offset: .3em; }
  #rayhan-media-options .rm-content {
    box-sizing: border-box;
    padding: clamp(1rem, 3vw, 2rem) clamp(.9rem, 4.3vw, 2.5rem);
    border-block-end: 1px solid var(--rm-gold);
    min-block-size: clamp(32rem, calc(18rem + 37vw), 43.5rem);
  }
  #rayhan-media-options h2 {
    margin: 0;
    color: var(--rm-ink);
    font: 400 clamp(1.25rem, 3vw, 1.8rem)/1.1 var(--rm-serif);
  }
  #rayhan-media-options .rm-grid { display: grid; gap: .8rem; }
  #rayhan-media-options .rm-halves { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  #rayhan-media-options .rm-thirds { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  #rayhan-media-options .rm-block { display: grid; gap: .7rem; align-content: start; min-inline-size: 0; }
  #rayhan-media-options .rm-content > .rm-block:not(:first-child) { margin-block-start: 1.2rem; }
  #rayhan-media-options .rm-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: .5rem;
  }
  #rayhan-media-options :is(.rm-page, .rm-lightbox) button {
    border: 1px solid var(--rm-line);
    padding: .35rem .7rem;
    color: var(--rm-ink);
    background: var(--rm-panel);
    font: inherit;
  }
  #rayhan-media-options :is(.rm-page, .rm-lightbox) button:is(:hover, [aria-pressed="true"]) { border-color: var(--rm-gold); color: var(--rm-gold); }
  #rayhan-media-options :is(.rm-page, .rm-lightbox) button:focus-visible { outline: 2px solid var(--rm-gold); outline-offset: 3px; }
  #rayhan-media-options .rm-still { margin: 0; min-inline-size: 0; }
  #rayhan-media-options .rm-still .rm-image-button {
    display: block;
    width: 100%;
    padding: 0;
    border: 0;
    background: var(--rm-panel);
    overflow: hidden;
  }
  #rayhan-media-options .rm-image-button:hover { outline: 1px solid var(--rm-gold); }
  #rayhan-media-options .rm-image-button img {
    display: block;
    width: 100%;
    aspect-ratio: 16 / 10;
    object-fit: cover;
    object-position: center var(--rm-photo-y, 35%);
  }
  #rayhan-media-options figcaption {
    margin-block-start: .32rem;
    color: var(--rm-muted);
    font-size: .78rem;
  }

    #rayhan-media-options .rm-stepper button { min-inline-size: 44px; }

<script>
  (() => {
    const root = document.getElementById('rayhan-media-options');
    const photos = JSON.parse(root.querySelector('#rm-photo-data').textContent);
    const keys = Object.keys(photos);
    const header = root.querySelector('#rm-page-header');
    const stillTemplate = root.querySelector('#rm-still');
    const reelLabel = root.querySelector('#rm-reel-label');
    const lightbox = root.querySelector('dialog');
    const lightboxImage = lightbox.querySelector('img');
    const lightboxTitle = lightbox.querySelector('h2');
    const lightboxCount = lightbox.querySelector('output');
    let currentPhoto = 0;

    function setImage(image, key, alt) {
      image.src = photos[key].source;
      image.alt = alt;
    }

    function renderLightbox() {
      const key = keys[currentPhoto];
      setImage(lightboxImage, key, photos[key].alt);
      lightboxTitle.textContent = photos[key].title;
      lightboxCount.textContent = `${currentPhoto + 1} / ${keys.length}`;
    }

    function still(key) {
      const element = stillTemplate.content.cloneNode(true);
      const control = element.querySelector('button');
      if (photos[key].position) control.style.setProperty('--rm-photo-y', photos[key].position);
      control.setAttribute('aria-label', `Open photo: ${photos[key].title}`);
      setImage(control.querySelector('img'), key, '');
      element.querySelector('figcaption').textContent = photos[key].title;
      control.addEventListener('click', () => {
        currentPhoto = keys.indexOf(key);
        renderLightbox();
        lightbox.showModal();
      });
      return element;
    }

    for (const page of root.querySelectorAll('.rm-page')) {
      page.prepend(header.content.cloneNode(true));
      if (globalThis.Tweak) {
        const options = { captions: true };
        const tweak = new Tweak({
          container: page,
          onChange: () => page.classList.toggle('rm-no-captions', !options.captions),
        });
        tweak.addToggle(options, 'captions', { label: 'Photo captions' });
      }
    }

    for (const region of root.querySelectorAll('[data-stills]')) {
      region.append(...region.dataset.stills.split(' ').map(still));
    }

    for (const reel of root.querySelectorAll('[data-reel]')) {
      if (reel.dataset.reel) {
        const poster = new Image();
        setImage(poster, reel.dataset.reel, '');
        reel.append(poster);
      }
      reel.append(reelLabel.content.cloneNode(true));
    }

    for (const region of root.querySelectorAll('[data-sequence]')) {
      const grid = region.querySelector('[data-sequence-images]');
      const count = region.querySelector('output');
      const filmstrip = region.dataset.sequence === 'filmstrip';
      const stepSize = filmstrip ? 3 : 1;
      let index = 0;
      const orderedKeys = filmstrip ? keys : ['period-stage', ...keys.filter((key) => key !== 'period-stage')];

      function renderSequence() {
        grid.replaceChildren(...orderedKeys.slice(index, index + stepSize).map(still));
        count.textContent = filmstrip ? `${index + 1}–${index + stepSize} / ${keys.length}` : `${index + 1} / ${keys.length}`;
      }

      for (const button of region.querySelectorAll('[data-step]')) {
        button.addEventListener('click', () => {
          index = (index + Number(button.dataset.step) * stepSize + keys.length) % keys.length;
          renderSequence();
        });
      }
      renderSequence();
    }

    const mediaTabs = root.querySelector('[data-media-tabs]');
    const categories = [...mediaTabs.querySelectorAll('[data-category]')];
    const panels = [...mediaTabs.querySelectorAll('[data-panel]')];
    for (const button of categories) {
      button.addEventListener('click', () => {
        for (const category of categories) category.setAttribute('aria-pressed', String(category === button));
        for (const panel of panels) panel.hidden = panel.dataset.panel !== button.dataset.category;
      });
    }

    const screening = root.querySelector('[data-screening]');
    const playlist = screening.querySelector('[data-playlist]');
    const display = screening.querySelector('.rm-screening-display');
    const reel = display.querySelector('.rm-reel');
    for (const key of playlist.dataset.playlist.split(' ')) {
      const button = document.createElement('button');
      button.type = 'button';
      button.className = 'cursor-interaction';
      button.textContent = photos[key].title;
      button.dataset.selection = key;
      button.setAttribute('aria-pressed', 'false');
      playlist.append(button);
    }
    const selections = screening.querySelectorAll('[data-selection]');
    for (const button of selections) {
      button.addEventListener('click', () => {
        for (const selection of selections) selection.setAttribute('aria-pressed', String(selection === button));
        display.replaceChildren(button.dataset.selection === 'reel' ? reel : still(button.dataset.selection));
      });
    }

    function moveLightbox(step) {
      currentPhoto = (currentPhoto + step + keys.length) % keys.length;
      renderLightbox();
    }
    for (const button of lightbox.querySelectorAll('[data-photo-step]')) {
      button.addEventListener('click', () => moveLightbox(Number(button.dataset.photoStep)));
    }
    lightbox.querySelector('[data-close-photo]').addEventListener('click', () => lightbox.close());
    lightbox.addEventListener('keydown', (event) => {
      if (event.key !== 'ArrowLeft' && event.key !== 'ArrowRight') return;
      event.preventDefault();
      moveLightbox(event.key === 'ArrowLeft' ? -1 : 1);
    });
  })();
</script>

<style>
  #rayhan-interaction-preview .preview-tabs { flex-wrap: wrap; margin-bottom: 12px; }

  #rayhan-interaction-preview .preview-replay { margin-top: 8px; }

  #rayhan-interaction-preview .portfolio-sample {
    color-scheme: dark;
    --site-bg: #111316;
    --site-panel: #25272b;
    --site-ink: #f6f4ef;
    --site-subtle: #cec9c2;
    --site-gold: #edc99f;
    --site-rule: #434447;
    --site-serif: Baskerville, "Iowan Old Style", Georgia, serif;
    --site-sans: "Avenir Next", Avenir, "Segoe UI", system-ui, sans-serif;
    background: var(--site-bg);
    color: var(--site-ink);
    font-family: var(--site-sans);
  }
  #rayhan-interaction-preview .portfolio-sample :focus-visible { outline: 2px solid var(--site-gold); outline-offset: 3px; }
  #rayhan-interaction-preview .portfolio-sample h2 { margin: 0; font: 400 clamp(1.4rem, 4vw, 2rem)/1.1 var(--site-serif); }
  #rayhan-interaction-preview .portfolio-sample button {
    background: transparent;
    color: inherit;
    border: 0;
    padding: 0;
    font: inherit;
  }

  #rayhan-interaction-preview .gallery-sample { padding: clamp(14px, 4vw, 24px); }
  #rayhan-interaction-preview .gallery-stills {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: clamp(8px, 2vw, 16px);
    margin-top: 12px;
  }
  #rayhan-interaction-preview .gallery-sample .gallery-still { display: grid; gap: 6px; text-align: start; font-size: .875rem; color: var(--site-subtle); }
  #rayhan-interaction-preview .still-frame { display: block; overflow: hidden; background: var(--site-panel); aspect-ratio: 16 / 10; }
  #rayhan-interaction-preview .still-frame img { display: block; width: 100%; height: 100%; object-fit: cover; object-position: center 35%; }

  #rayhan-interaction-preview .header-sample {
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 2px 16px;
    padding: 10px clamp(12px, 4vw, 24px);
    border-bottom: 1px solid var(--site-rule);
  }
  #rayhan-interaction-preview .sample-brand { font: 400 clamp(1.15rem, 3vw, 1.5rem)/1 var(--site-serif); white-space: nowrap; }
  #rayhan-interaction-preview .header-sample nav { display: flex; align-items: center; flex-wrap: wrap; gap: 0 clamp(10px, 2vw, 16px); }
  #rayhan-interaction-preview .header-sample .sample-nav-link,
  #rayhan-interaction-preview .sample-current { font-size: .875rem; line-height: 1.35; font-weight: 620; }
  #rayhan-interaction-preview .sample-current { text-decoration: underline; text-underline-offset: .33em; }
  #rayhan-interaction-preview .header-sample .sample-nav-link { position: relative; min-height: 44px; color: var(--site-subtle); }
  #rayhan-interaction-preview .sample-nav-link::after {
    content: "";
    position: absolute;
    inset: auto 0 10px;
    height: 1px;
    background: var(--site-gold);
    transform: scaleX(0);
    transform-origin: left;
  }
  #rayhan-interaction-preview .header-sample .sample-nav-link:is(:hover, :focus-visible, [data-preview-active]) { color: var(--site-gold); }
  #rayhan-interaction-preview .sample-nav-link:is(:hover, :focus-visible, [data-preview-active])::after { transform: scaleX(1); }

  #rayhan-interaction-preview .resume-sample {
    display: grid;
    grid-template-columns: minmax(64px, 8rem) minmax(0, 1fr);
    align-items: center;
    gap: clamp(10px, 4vw, 24px);
    padding: clamp(14px, 4vw, 24px);
  }
  #rayhan-interaction-preview .resume-sample img { display: block; width: 100%; height: auto; }
  #rayhan-interaction-preview .resume-format { margin-bottom: 5px; color: var(--site-subtle); font-size: .75rem; letter-spacing: .06em; text-transform: uppercase; }
  #rayhan-interaction-preview .resume-sample .resume-download {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    min-height: 44px;
    margin-top: 6px;
    color: var(--site-gold);
    font-size: .75rem;
    letter-spacing: .07em;
    text-transform: uppercase;
  }
  #rayhan-interaction-preview .resume-download:is(:hover, :focus-visible, [data-preview-active]) { text-decoration: underline; text-underline-offset: .25em; }
  #rayhan-interaction-preview .download-icon { display: grid; place-items: center; width: 16px; height: 16px; }
  #rayhan-interaction-preview .download-icon svg { width: 16px; height: 16px; }

  #rayhan-interaction-preview .contact-sample { padding: clamp(14px, 4vw, 24px); }
  #rayhan-interaction-preview .contact-fields {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 12px 16px;
    max-width: 27rem;
    margin-top: 12px;
    padding: clamp(12px, 4vw, 22px);
    border: 1px solid var(--site-rule);
    background: var(--site-panel);
  }
  #rayhan-interaction-preview .contact-field { display: grid; gap: 4px; }
  #rayhan-interaction-preview .contact-field span { font-size: .8125rem; letter-spacing: .07em; color: var(--site-subtle); text-transform: uppercase; }
  #rayhan-interaction-preview .contact-field input {
    width: 100%;
    min-height: 44px;
    padding: 4px 0;
    border: 0;

    border-radius: 0;
    background: transparent;
    color: var(--site-ink);
    font: inherit;
    font-size: 1rem;

  #rayhan-interaction-preview .contact-email { grid-column: 1 / -1; }
  #rayhan-interaction-preview .contact-field input:focus,
  #rayhan-interaction-preview .contact-field[data-preview-active] input { border-color: var(--site-gold); }

  #rayhan-interaction-preview .reel-sample { position: relative; isolation: isolate; display: grid; align-items: end; min-height: clamp(145px, 36vw, 255px); }
  #rayhan-interaction-preview .reel-poster,
  #rayhan-interaction-preview .reel-sample::after { position: absolute; inset: 0; }

  #rayhan-interaction-preview .reel-sample::after { z-index: -1; content: ""; background: linear-gradient(0deg, #0c0d0ff5, #0c0d0f50 62%, transparent); }
  #rayhan-interaction-preview .reel-label { display: flex; align-items: center; gap: 9px; padding: clamp(12px, 3vw, 22px); }
  #rayhan-interaction-preview .reel-sample .reel-play { display: grid; place-items: center; flex: 0 0 44px; min-height: 44px; color: var(--site-gold); }
  #rayhan-interaction-preview .play-ring { position: relative; display: grid; place-items: center; width: 34px; height: 34px; }
  #rayhan-interaction-preview .play-ring::after { position: absolute; inset: 0; border: 1px solid currentColor; border-radius: 50%; content: ""; }

    #rayhan-interaction-preview .sample-nav-link::after { transition: transform 180ms ease-out; }
    #rayhan-interaction-preview .download-icon { transition: transform 160ms ease-out; }
    #rayhan-interaction-preview .resume-download:is(:hover, :focus-visible, [data-preview-active]) .download-icon { transform: translateY(2px); }
    #rayhan-interaction-preview .contact-field input { transition: border-color 150ms ease-out; }
    #rayhan-interaction-preview .play-ring::after { transition: transform 180ms ease-out; }
    #rayhan-interaction-preview .reel-play:is(:hover, :focus-visible, [data-preview-active]) .play-ring::after { transform: scale(1.12); }
  }
</style>

<script>
  (() => {
    const preview = document.getElementById('rayhan-interaction-preview');
    const timers = new WeakMap();
    preview.querySelector('.reel-poster').src = preview.querySelector('.little-death-still').src;

    function showEffect(target) {
      clearTimeout(timers.get(target));
      target.setAttribute('data-preview-active', '');
      timers.set(target, setTimeout(() => target.removeAttribute('data-preview-active'), 650));
    }

    preview.querySelectorAll('[data-preview-target]').forEach((button) => {
      button.addEventListener('click', () => showEffect(button));
    });

    preview.querySelector('[data-replay]').addEventListener('click', () => {
      const tab = preview.querySelector('[role="tab"][aria-selected="true"]');
      const panel = document.getElementById(tab.getAttribute('aria-controls'));
      showEffect(panel.querySelector('[data-replay-target]'));
    });
  })();
</script>
